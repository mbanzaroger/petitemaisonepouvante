        targetId: { type: string }
        excerpt: { type: string }
        targetAuthorName: { type: string }
        reporterName: { type: string }
        reason: { type: string }
        status: { type: string, enum: [OPEN, ACTIONED, DISMISSED] }
        createdAt: { type: string, format: date-time }
        handledBy: { type: [string, "null"] }
        handledAt: { type: [string, "null"], format: date-time }
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
