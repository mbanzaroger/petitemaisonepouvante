# Expérimentation E3 (#20) — RabbitMQ sur Kubernetes : saga, idempotence, DLQ, panne de nœud.
# Protocole : docs/experimentations/E3.md ; script reproductible en local : experiments/e3/run.sh
name: "Expérimentation E3 — RabbitMQ sur Kubernetes"

on:
  push:
    branches: ["exp/E3-*"]
    paths: ["experiments/e3/**", ".github/workflows/exp-e3-rabbitmq.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e3:
    name: E3 sur kind
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cluster kind
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: e3
      - name: Exécuter l'expérimentation
        run: experiments/e3/run.sh
      - name: Diagnostic
        if: failure()
        run: |
          kubectl get pods,pvc,rabbitmqcluster -A
          kubectl -n pme-mq logs pme-rabbit-server-0 -c rabbitmq --tail=60 || true
      - name: Preuves
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e3-resultats
          path: experiments/e3/resultats/
          if-no-files-found: ignore
