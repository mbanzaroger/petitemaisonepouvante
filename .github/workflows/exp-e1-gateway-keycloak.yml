# Expérimentation E1 (#18) — Gateway API + cert-manager + Keycloak sur un cluster kind éphémère.
# Protocole : docs/experimentations/E1.md ; script reproductible en local : experiments/e1/run.sh
name: "Expérimentation E1 — Gateway, TLS et OIDC"

on:
  push:
    branches: ["exp/E1-*"]
    paths: ["experiments/e1/**", ".github/workflows/exp-e1-gateway-keycloak.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e1:
    name: E1 sur kind
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cluster kind
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: e1
      - name: Exécuter l'expérimentation
        run: experiments/e1/run.sh
      - name: Diagnostic
        if: failure()
        run: |
          kubectl get pods -A
          kubectl get gateway,httproute,securitypolicy,certificate -A -o yaml | tail -200
          kubectl -n pme logs deploy/keycloak --tail=80 || true
          kubectl -n envoy-gateway-system logs deploy/envoy-gateway --tail=80 || true
      - name: Preuves
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e1-resultats
          path: |
            experiments/e1/resultats/
            !experiments/e1/resultats/ca.crt
          if-no-files-found: ignore
