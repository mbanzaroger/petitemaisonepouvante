# Déploiement continu en staging : cluster Kubernetes éphémère (kind) créé dans le runner.
# Workflow réutilisable appelé par ci.yml (job « CD staging ») après une CI verte sur un push vers develop
# ou main ; lançable aussi à la main sur une branche. Contrat de fichiers : docs/10-gouvernance-depot.md §4.
# Pas de déclencheur workflow_run : le code déployé est toujours celui du commit de l'événement (github.sha),
# jamais un SHA fourni par un autre workflow (CodeQL : empoisonnement de cache, code non fiable).
name: CD staging

on:
  workflow_call:
    inputs:
      charge:
        description: Lancer le test de charge JMeter (indicateur 3)
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      charge:
        description: Lancer le test de charge JMeter (indicateur 3)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  staging:
    name: Déploiement staging (kind) + smoke + e2e + Lighthouse + supervision + DAST
    # Un cluster kind par runner : rien n'est partagé entre branches, seuls les runs d'une même branche se suivent.
    concurrency:
      group: cd-staging-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: staging
    permissions:
      contents: read
      packages: read
    env:
      SHA: ${{ github.sha }}
      OVERLAY: k8s/overlays/staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Manifestes de staging présents ?
        id: ready
        run: |
          if [ -f "$OVERLAY/kustomization.yaml" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "Aucun manifeste dans \`$OVERLAY\` : déploiement ignoré (prévu au jalon 3)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Créer le cluster kind
        if: steps.ready.outputs.ok == 'true'
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: pme-staging
          config: ${{ hashFiles('k8s/kind-config.yaml') != '' && 'k8s/kind-config.yaml' || '' }}

      - name: Connexion à GHCR
        if: steps.ready.outputs.ok == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Charger les images du commit dans le cluster
        if: steps.ready.outputs.ok == 'true'
        run: |
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          for dir in services/*/ frontend/; do
            svc=$(basename "$dir")
            [ "$svc" = frontend ] && svc=web-frontend
            [ -f "$dir/Dockerfile" ] || continue
            image="$prefix/$svc:sha-$SHA"
            # Image publiée par la CI (push sur develop/main) ; à défaut (lancement manuel sur une branche), construite ici.
            docker pull "$image" || docker build -t "$image" "$dir"
            kind load docker-image "$image" --name pme-staging
            # Le nom à remplacer est celui produit par la base (registre compris), sinon l'image :develop resterait.
            (cd "$OVERLAY" && kustomize edit set image "$prefix/$svc=$image")
          done

      - name: Socle du cluster (Envoy Gateway, cert-manager, Keycloak, opérateur RabbitMQ)
        if: steps.ready.outputs.ok == 'true' && hashFiles('k8s/staging-bootstrap.sh') != ''
        run: bash k8s/staging-bootstrap.sh

      - name: Déployer (Kustomize)
        if: steps.ready.outputs.ok == 'true'
        run: |
          # Le webhook de l'opérateur RabbitMQ peut répondre avec quelques secondes de retard.
          for _ in $(seq 1 12); do kubectl apply -k "$OVERLAY" && break; sleep 5; done
          kubectl -n pme wait rabbitmqcluster/pme-rabbit --for=condition=AllReplicasReady --timeout=600s
          kubectl wait --for=condition=available deployment --all --all-namespaces --timeout=600s
          # Garde-fou : chaque service tourne bien avec l'image du commit déployé
          for svc in catalog-service order-service stock-service community-service web-frontend; do
            deployed=$(kubectl -n pme get "deploy/$svc" -o jsonpath='{.spec.template.spec.containers[0].image}')
            echo "$svc → $deployed"
            case "$deployed" in *":sha-$SHA") ;; *) echo "::error::$svc ne déploie pas l'image du commit ($deployed)"; exit 1 ;; esac
          done
          echo "127.0.0.1 api.pme.local keycloak.pme.local app.pme.local" | sudo tee -a /etc/hosts

      - name: Smoke tests
        if: steps.ready.outputs.ok == 'true' && env.BASE_URL != '' && hashFiles('scripts/smoke-test.sh') != ''
        run: bash scripts/smoke-test.sh "$BASE_URL"

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        if: steps.ready.outputs.ok == 'true' && env.BASE_URL != '' && hashFiles('acceptance-tests/pom.xml') != ''
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Tests d'acceptation Cucumber (US1 à US4, US8 à US12)
        if: steps.ready.outputs.ok == 'true' && env.BASE_URL != '' && hashFiles('acceptance-tests/pom.xml') != ''
        working-directory: acceptance-tests
        run: ./mvnw -B -ntp test

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.ready.outputs.ok == 'true' && env.BASE_URL != '' && hashFiles('frontend/playwright.config.ts') != ''
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Tests de bout en bout du site (Playwright, accessibilité axe)
        if: steps.ready.outputs.ok == 'true' && env.BASE_URL != '' && hashFiles('frontend/playwright.config.ts') != ''
        working-directory: frontend
        env:
          SITE_URL: https://app.pme.local:8443
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Lighthouse (performance, accessibilité, bonnes pratiques, référencement)
        if: steps.ready.outputs.ok == 'true' && env.BASE_URL != '' && hashFiles('frontend/scripts/lighthouse-seuils.mjs') != ''
        working-directory: frontend
        run: |
          # Chromium installé par Playwright à l'étape précédente ; version de Lighthouse épinglée
          CHROME_PATH=$(node -e "import('@playwright/test').then((m) => console.log(m.chromium.executablePath()))")
          export CHROME_PATH
          mkdir -p lighthouse
          for page in "catalogue|/" "fiche-produit|/produits/0f6c1a10-0008-4000-8000-000000000008" "troc|/communaute" "plan-du-site|/plan-du-site"; do
            npx -y lighthouse@13.6.0 "https://app.pme.local:8443${page#*|}" --preset=desktop \
              --chrome-flags="--headless=new --no-sandbox --ignore-certificate-errors" \
              --output=json --output=html --output-path="lighthouse/${page%%|*}" --quiet
          done
          { echo "## Lighthouse (site, staging)"; echo; node scripts/lighthouse-seuils.mjs lighthouse; } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Rapport Lighthouse
        if: always() && steps.ready.outputs.ok == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-staging-${{ env.SHA }}
          path: frontend/lighthouse/
          if-no-files-found: ignore
          retention-days: 30

      - name: Rapport Playwright (captures et résultats axe)
        if: always() && steps.ready.outputs.ok == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-staging-${{ env.SHA }}
          path: frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 30

      - name: Supervision (kube-prometheus-stack, règles et tableau de bord versionnés)
        if: steps.ready.outputs.ok == 'true' && env.BASE_URL != '' && hashFiles('k8s/monitoring/install.sh') != ''
        run: bash k8s/monitoring/install.sh

      - name: Vérification US5 (métriques, alertes, Grafana, logs corrélés)
        if: steps.ready.outputs.ok == 'true' && env.GRAFANA_PASSWORD != ''
        run: bash k8s/monitoring/verify.sh

      - name: Test de charge JMeter (indicateur 3, p95 < 300 ms et erreurs < 1 %)
        if: steps.ready.outputs.ok == 'true' && inputs.charge && env.BASE_URL != ''
        run: bash load-tests/run.sh

      - name: Rapport de charge
        if: always() && inputs.charge && steps.ready.outputs.ok == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: charge-${{ env.SHA }}
          path: load-tests/target/
          if-no-files-found: ignore
          retention-days: 30

      - name: Rapport Cucumber
        if: always() && steps.ready.outputs.ok == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cucumber-staging-${{ env.SHA }}
          path: acceptance-tests/target/cucumber-reports/
          if-no-files-found: ignore

      - name: DAST — OWASP ZAP (baseline + scan actif de l'API OpenAPI)
        if: steps.ready.outputs.ok == 'true' && env.BASE_URL != ''
        run: bash scripts/dast.sh

      - name: Rapport ZAP
        if: always() && steps.ready.outputs.ok == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-staging-${{ env.SHA }}
          path: zap/
          if-no-files-found: ignore

      - name: Diagnostic en cas d'échec
        if: failure() && steps.ready.outputs.ok == 'true'
        run: |
          kubectl get all --all-namespaces
          kubectl get gateway,httproute,securitypolicy,backendtrafficpolicy,networkpolicy -A
          kubectl get events --all-namespaces --sort-by=.lastTimestamp | tail -50
          for d in catalog-service order-service stock-service community-service web-frontend; do kubectl -n pme logs "deploy/$d" --tail=60 || true; done
          kubectl get servicemonitor,prometheusrule -A 2>/dev/null || true
          kubectl get hpa -A 2>/dev/null || true
