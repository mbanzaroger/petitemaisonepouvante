name: Bug
description: Comportement incorrect constaté.
labels: ["type:bug"]
body:
  - type: textarea
    id: actual
    attributes:
      label: Comportement constaté
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version ou commit
  - type: markdown
    attributes:
      value: "Rappel : tout bug corrigé reçoit un test de non-régression (politique de tests, règle 1)."
