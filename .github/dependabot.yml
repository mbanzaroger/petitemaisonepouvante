# Mises à jour automatisées des dépendances (politique de sécurité §5).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule: { interval: weekly, day: monday }
    labels: ["type:dependencies"]
    commit-message: { prefix: ci }
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: maven
    directories: ["/services/*"]
    target-branch: develop
    schedule: { interval: weekly, day: monday }
    labels: ["type:dependencies"]
    commit-message: { prefix: build }
    open-pull-requests-limit: 3
    # Une seule PR par service et par semaine pour toutes les dépendances Maven (moins d'exécutions de CI)
    groups:
      maven:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: ["/services/*"]
    target-branch: develop
    schedule: { interval: weekly, day: monday }
    labels: ["type:dependencies"]
    commit-message: { prefix: build }
    ignore:
      # Image de build : Java LTS uniquement (21), alignée sur l'image d'exécution distroless java21
      - dependency-name: "maven"

  - package-ecosystem: docker-compose
    directory: /infra
    target-branch: develop
    schedule: { interval: monthly }
    labels: ["type:dependencies"]
    commit-message: { prefix: build }
