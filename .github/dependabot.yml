# Mises à jour automatisées des dépendances (politique de sécurité §5).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule: { interval: weekly, day: monday }
    labels: ["type:dependencies"]
    commit-message: { prefix: ci }
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: maven
    directories: ["/services/*"]
    target-branch: develop
    schedule: { interval: weekly, day: monday }
    labels: ["type:dependencies"]
    commit-message: { prefix: build }
    open-pull-requests-limit: 3
    # Une seule PR par service et par semaine pour toutes les dépendances Maven (moins d'exécutions de CI)
    groups:
      maven:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    target-branch: develop
    schedule: { interval: weekly, day: monday }
    labels: ["type:dependencies"]
    commit-message: { prefix: build }
    open-pull-requests-limit: 3
    # Une PR groupée par semaine ; les mises à jour majeures (React, Vite, ESLint…) restent séparées pour revue.
    groups:
      npm-mineures:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Node 22 LTS (image de build) : types alignés sur la version d'exécution
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  - package-ecosystem: docker
    directories: ["/services/*", "/frontend"]
    target-branch: develop
    schedule: { interval: weekly, day: monday }
    labels: ["type:dependencies"]
    commit-message: { prefix: build }
    ignore:
      # Image de build : Java LTS uniquement (21), alignée sur l'image d'exécution distroless java21
      - dependency-name: "maven"

  - package-ecosystem: docker-compose
    directory: /infra
    target-branch: develop
    schedule: { interval: monthly }
    labels: ["type:dependencies"]
    commit-message: { prefix: build }
