# Infrastructure locale de DÉVELOPPEMENT uniquement (identifiants par défaut non utilisables en production).
services:
  postgres-catalog:
    image: postgres:16
    environment: { POSTGRES_DB: catalog, POSTGRES_USER: catalog, POSTGRES_PASSWORD: catalog_dev }
    ports: ["5433:5432"]
  postgres-orders:
    image: postgres:16
    environment: { POSTGRES_DB: orders, POSTGRES_USER: orders, POSTGRES_PASSWORD: orders_dev }
    ports: ["5434:5432"]
  postgres-stock:
    image: postgres:16
    environment: { POSTGRES_DB: stock, POSTGRES_USER: stock, POSTGRES_PASSWORD: stock_dev }
    ports: ["5435:5432"]
  postgres-keycloak:
    image: postgres:16
    environment: { POSTGRES_DB: keycloak, POSTGRES_USER: keycloak, POSTGRES_PASSWORD: keycloak_dev }
  rabbitmq:
    image: rabbitmq:3.13-management
    ports: ["5672:5672", "15672:15672"]
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_dev
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports: ["8080:8080"]
    depends_on: [postgres-keycloak]
  prometheus:
    image: prom/prometheus:v2.53.0
    volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:11.1.0
    ports: ["3000:3000"]
    depends_on: [prometheus]
