# Collecte locale : services lancés par « docker compose --profile app » (noms de conteneurs).
# Pour un service lancé depuis l'IDE sur le poste, remplacer la cible par host.docker.internal:<port>.
global:
  scrape_interval: 10s
  evaluation_interval: 10s
rule_files: ["/etc/prometheus/alerts.yml"]
scrape_configs:
  - job_name: catalog-service
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["catalog-service:8081"], labels: { service: catalog-service } }]
  - job_name: order-service
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["order-service:8082"], labels: { service: order-service } }]
  - job_name: stock-service
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["stock-service:8083"], labels: { service: stock-service } }]
  - job_name: community-service
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["community-service:8084"], labels: { service: community-service } }]
  # Site : métriques nginx (stub_status) exposées par l'exporteur qui partage le réseau du conteneur web-frontend
  - job_name: web-frontend
    static_configs: [{ targets: ["web-frontend:9113"], labels: { service: web-frontend } }]
  # Profondeur de chaque file (dont les files de rebut) : point de terminaison détaillé du plugin rabbitmq_prometheus
  - job_name: rabbitmq
    metrics_path: /metrics/detailed
    params: { family: [queue_coarse_metrics, queue_consumer_count] }
    static_configs: [{ targets: ["rabbitmq:15692"], labels: { service: rabbitmq } }]
