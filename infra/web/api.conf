# Local (docker compose) uniquement : remplace /etc/nginx/pme-api/api.conf de l'image pour relayer l'API vers les
# services, comme le fait le Gateway en staging. Le navigateur ne voit qu'une origine (http://localhost:5173).
location /api/v1/products {
    proxy_pass http://catalog-service:8081;
}

location /api/v1/categories {
    proxy_pass http://catalog-service:8081;
}

location /api/v1/stock {
    proxy_pass http://stock-service:8083;
}

location /api/v1/orders {
    client_max_body_size 16k;
    proxy_pass http://order-service:8082;
}

location /api/ {
    default_type application/problem+json;
    return 404 '{"type":"about:blank","title":"Not Found","status":404}';
}
