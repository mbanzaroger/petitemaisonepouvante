# Local (docker compose) uniquement : remplace /etc/nginx/pme-api/api.conf de l'image pour relayer l'API vers les
# services, comme le fait le Gateway en staging. Le navigateur ne voit qu'une origine (http://localhost:5173).
#
# Les noms des services sont résolus à chaque requête par le DNS interne de Docker (127.0.0.11) et non au
# démarrage : le site démarre même si un service n'est pas encore prêt ou redémarre (502 le temps qu'il revienne).
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

location /api/v1/products {
    set $catalogue http://catalog-service:8081;
    proxy_pass $catalogue;
}

location /api/v1/categories {
    set $catalogue http://catalog-service:8081;
    proxy_pass $catalogue;
}

# Recommandations et personnalisation (US13), servies par le catalogue.
location /api/v1/recommendations {
    set $catalogue http://catalog-service:8081;
    proxy_pass $catalogue;
}

location /api/v1/interests {
    client_max_body_size 4k;
    set $catalogue http://catalog-service:8081;
    proxy_pass $catalogue;
}

# Image d'un produit envoyée par l'administrateur (US21) : 2 Mo au plus, contrôlés aussi par le service.
location ~ ^/api/v1/catalog/admin/products/[^/]+/image$ {
    client_max_body_size 2m;
    set $catalogue http://catalog-service:8081;
    proxy_pass $catalogue;
}

# Gestion des produits (US18, ADMIN), servie par le catalogue.
location /api/v1/catalog/admin {
    client_max_body_size 8k;
    set $catalogue http://catalog-service:8081;
    proxy_pass $catalogue;
}

location /api/v1/stock {
    client_max_body_size 1k;
    set $stock http://stock-service:8083;
    proxy_pass $stock;
}

location /api/v1/orders {
    client_max_body_size 16k;
    set $commandes http://order-service:8082;
    proxy_pass $commandes;
}

# Espace communautaire (troc, salons, notifications, modération).
location /api/v1/community {
    client_max_body_size 16k;
    set $communaute http://community-service:8084;
    proxy_pass $communaute;
}

# Éditions : actualités, articles, fanzine numérique, abonnements.
location /api/v1/editorial {
    client_max_body_size 32k;
    set $editions http://editorial-service:8085;
    proxy_pass $editions;
}

# Keycloak sur la même origine que le site (mode Codespaces, infra/codespaces.sh) : seules les pages OIDC du royaume
# et les ressources des pages de connexion sont relayées, jamais la console d'administration.
location ^~ /realms/ {
    set $keycloak http://keycloak:8080;
    proxy_pass $keycloak;
    proxy_set_header Host $http_host;
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
}

location ^~ /resources/ {
    set $keycloak http://keycloak:8080;
    proxy_pass $keycloak;
    proxy_set_header Host $http_host;
}

location /api/ {
    default_type application/problem+json;
    return 404 '{"type":"about:blank","title":"Not Found","status":404}';
}
