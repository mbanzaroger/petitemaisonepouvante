# catalog-service (image construite depuis le dépôt) et sa base PostgreSQL, instrumentés pour Prometheus.
apiVersion: v1
kind: Namespace
metadata:
  name: pme
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-db
  namespace: pme
spec:
  replicas: 1
  selector:
    matchLabels: { app: catalog-db }
  template:
    metadata:
      labels: { app: catalog-db }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - { name: POSTGRES_DB, value: catalog }
            - { name: POSTGRES_USER, value: catalog }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: catalog-db, key: password } }
          ports: [{ containerPort: 5432 }]
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "catalog"] }
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-db
  namespace: pme
spec:
  selector: { app: catalog-db }
  ports: [{ port: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  namespace: pme
spec:
  replicas: 1
  selector:
    matchLabels: { app: catalog-service }
  template:
    metadata:
      labels: { app: catalog-service }
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: catalog-service
          image: catalog-service:e4
          imagePullPolicy: Never
          env:
            - { name: DB_URL, value: "jdbc:postgresql://catalog-db:5432/catalog" }
            - { name: DB_USER, value: catalog }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: catalog-db, key: password } }
            - { name: SPRING_DATASOURCE_HIKARI_CONNECTIONTIMEOUT, value: "2000" }
            - { name: LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB_SERVLET_DISPATCHERSERVLET, value: DEBUG }
          ports: [{ name: http, containerPort: 8081 }]
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            initialDelaySeconds: 30
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
  namespace: pme
  labels: { app: catalog-service }
spec:
  selector: { app: catalog-service }
  ports: [{ name: http, port: 8081, targetPort: http }]
