# Configuration de order-service. Les valeurs par défaut correspondent à infra/docker-compose.yml (développement local) ;
# en staging et en production, DB_URL, DB_USER et DB_PASSWORD sont injectés par des Secrets Kubernetes.
server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful

spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/orders}
    username: ${DB_USER:orders}
    password: ${DB_PASSWORD:orders_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{correlationId:-}]"
