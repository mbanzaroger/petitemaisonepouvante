# Configuration de stock-service. Les valeurs par défaut correspondent à infra/docker-compose.yml (développement local) ;
# en staging et en production, les secrets (base, broker) sont injectés par des Secrets Kubernetes.
server:
  port: ${SERVER_PORT:8083}
  shutdown: graceful

spring:
  application:
    name: stock-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/stock}
    username: ${DB_USER:stock}
    password: ${DB_PASSWORD:stock_dev}
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Clés lues sur l'adresse interne de Keycloak ; émetteur et audience vérifiés dans chaque jeton (US2).
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8080/realms/pme/protocol/openid-connect/certs}
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8080/realms/pme}
          audiences: pme-api
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}
    # Accusé du broker attendu avant de marquer un événement publié (boîte d'envoi transactionnelle)
    publisher-confirm-type: simple
    listener:
      simple:
        prefetch: 10
        # Après 3 tentatives, le message part en file de rebut au lieu de boucler
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 500ms

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      # Histogrammes de latence : nécessaires au calcul du p95 (indicateur 3) dans Prometheus
      percentiles-histogram:
        http.server.requests: true
pme:
  outbox:
    delay-ms: 500

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{correlationId:-}]"
