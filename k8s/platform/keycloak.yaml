# Keycloak 26 de staging (mode développement, base H2 embarquée). En production : mode « start », base PostgreSQL,
# au moins 2 réplicas et console d'administration non exposée.
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: pme
spec:
  selector:
    app: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: pme
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.8.2
          args: ["start-dev", "--import-realm"]
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: password
            - name: KC_HOSTNAME
              value: https://keycloak.pme.local:8443
            - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
              value: "true"
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: KC_HEALTH_ENABLED
              value: "true"
          ports:
            - containerPort: 8080
            - containerPort: 9000
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            initialDelaySeconds: 15
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  namespace: pme
spec:
  parentRefs:
    - name: pme-gateway
  hostnames: ["keycloak.pme.local"]
  # Seuls les points d'accès OIDC du royaume « pme » et les ressources des pages de connexion sont exposés :
  # la console d'administration (/admin) et le royaume « master » ne sont joignables que par « kubectl port-forward »
  # (analyse de sécurité, J4).
  rules:
    - matches:
        - { path: { type: PathPrefix, value: /realms/pme/ } }
        - { path: { type: PathPrefix, value: /resources/ } }
      backendRefs:
        - name: keycloak
          port: 8080
