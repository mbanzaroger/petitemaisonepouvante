# web-frontend : SPA React servie par nginx non root (UID 101), système de fichiers en lecture seule.
# Seuls /tmp (cache, PID) et /etc/nginx/conf.d (gabarits rendus au démarrage) sont inscriptibles.
# Sidecar nginx-prometheus-exporter pour la supervision (docs/12).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-frontend
  labels: { app: web-frontend, app.kubernetes.io/part-of: petitemaisonepouvante }
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app: web-frontend }
  template:
    metadata:
      labels: { app: web-frontend, app.kubernetes.io/part-of: petitemaisonepouvante }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web-frontend
          image: web-frontend
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - name: KEYCLOAK_URL
              valueFrom: { configMapKeyRef: { name: pme-config, key: keycloak-public-url } }
            - { name: KEYCLOAK_REALM, value: pme }
            - { name: KEYCLOAK_CLIENT_ID, value: pme-web }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: conf, mountPath: /etc/nginx/conf.d }
        # Exporteur Prometheus : lit stub_status sur 127.0.0.1:8081 (même pod) et expose /metrics sur 9113.
        - name: nginx-exporter
          image: nginx/nginx-prometheus-exporter:1.5.3
          imagePullPolicy: IfNotPresent
          args: ["--nginx.scrape-uri=http://127.0.0.1:8081/stub_status", "--web.listen-address=:9113"]
          ports:
            - { name: metrics, containerPort: 9113 }
          resources:
            requests: { cpu: 5m, memory: 16Mi }
            limits: { cpu: 50m, memory: 32Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: conf, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: web-frontend
  labels: { app: web-frontend }
spec:
  selector: { app: web-frontend }
  ports:
    - { name: http, port: 8080, targetPort: http }
    - { name: metrics, port: 9113, targetPort: metrics }
