# order-service : utilisateur non root, système de fichiers en lecture seule, capacités retirées, ressources bornées.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  labels: { app: order-service, app.kubernetes.io/part-of: petitemaisonepouvante }
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app: order-service }
  template:
    metadata:
      labels: { app: order-service, app.kubernetes.io/part-of: petitemaisonepouvante }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: order-service
          image: order-service
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8082 }
          env:
            - { name: DB_URL, value: "jdbc:postgresql://orders-db:5432/orders" }
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: orders-db, key: username } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: orders-db, key: password } }
            - name: JWT_JWK_SET_URI
              valueFrom: { configMapKeyRef: { name: pme-config, key: jwt-jwk-set-uri } }
            - name: JWT_ISSUER_URI
              valueFrom: { configMapKeyRef: { name: pme-config, key: jwt-issuer-uri } }
            - { name: RABBIT_HOST, value: pme-rabbit }
            - name: RABBIT_USER
              valueFrom: { secretKeyRef: { name: pme-rabbit-default-user, key: username } }
            - name: RABBIT_PASSWORD
              valueFrom: { secretKeyRef: { name: pme-rabbit-default-user, key: password } }
            - { name: CATALOG_URL, value: "http://catalog-service:8081" }
            - { name: JAVA_TOOL_OPTIONS, value: "-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError" }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { cpu: "1", memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  labels: { app: order-service }
spec:
  selector: { app: order-service }
  ports:
    - { name: http, port: 8082, targetPort: http }
