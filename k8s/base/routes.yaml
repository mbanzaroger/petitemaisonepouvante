              - { name: Cross-Origin-Resource-Policy, value: same-origin }
      backendRefs: [{ name: stock-service, port: 8083 }]
---
# Personnalisation des recommandations (US13) : consentement et signaux d'intérêt, réservés aux membres.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: catalog-interests
spec:
  parentRefs: [{ name: pme-gateway }]
  hostnames: ["api.pme.local", "app.pme.local"]
  rules:
    - matches: [{ path: { type: PathPrefix, value: /api/v1/interests } }]
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - { name: Strict-Transport-Security, value: "max-age=31536000; includeSubDomains" }
              - { name: Cross-Origin-Resource-Policy, value: same-origin }
      backendRefs: [{ name: catalog-service, port: 8081 }]
---
# Espace communautaire : la consultation des annonces (GET) est publique ; toute autre requête passe par la route
# « community » (jeton exigé). Règle de précédence Gateway API : le préfixe le plus long et la méthode l'emportent.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: community-public
spec:
  parentRefs: [{ name: pme-gateway }]
  hostnames: ["api.pme.local", "app.pme.local"]
  rules:
    - matches: [{ path: { type: PathPrefix, value: /api/v1/community/listings }, method: GET }]
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - { name: Strict-Transport-Security, value: "max-age=31536000; includeSubDomains" }
              - { name: Cross-Origin-Resource-Policy, value: same-origin }
      backendRefs: [{ name: community-service, port: 8084 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: community
spec:
  parentRefs: [{ name: pme-gateway }]
  hostnames: ["api.pme.local", "app.pme.local"]
  rules:
    - matches: [{ path: { type: PathPrefix, value: /api/v1/community } }]
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - { name: Strict-Transport-Security, value: "max-age=31536000; includeSubDomains" }
              - { name: Cross-Origin-Resource-Policy, value: same-origin }
      backendRefs: [{ name: community-service, port: 8084 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: community-moderation
spec:
  parentRefs: [{ name: pme-gateway }]
  hostnames: ["api.pme.local", "app.pme.local"]
  rules:
    - matches: [{ path: { type: PathPrefix, value: /api/v1/community/moderation } }]
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - { name: Strict-Transport-Security, value: "max-age=31536000; includeSubDomains" }
              - { name: Cross-Origin-Resource-Policy, value: same-origin }
      backendRefs: [{ name: community-service, port: 8084 }]
---
# Site web : tout le reste de app.pme.local est servi par web-frontend (nginx), qui pose ses propres en-têtes
# (CSP, anti-clickjacking) ; le Gateway ajoute HSTS puisque le TLS se termine ici.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
spec:
  parentRefs: [{ name: pme-gateway }]
  hostnames: ["app.pme.local"]
  rules:
    - matches: [{ path: { type: PathPrefix, value: / } }]
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - { name: Strict-Transport-Security, value: "max-age=31536000; includeSubDomains" }
      backendRefs: [{ name: web-frontend, port: 8080 }]
---
# Chemins inconnus : réponse 404 problem+json produite par le Gateway, avec les en-têtes de sécurité
# (sans cette route, Envoy répond lui-même sans HSTS). Les routes plus précises restent prioritaires.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: api-introuvable
spec:
  directResponse:
    contentType: application/problem+json
    statusCode: 404
    body:
      type: Inline
      inline: '{"type":"about:blank","title":"Not Found","status":404}'
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-introuvable
spec:
  parentRefs: [{ name: pme-gateway }]
  hostnames: ["api.pme.local"]
  rules:
    - matches: [{ path: { type: PathPrefix, value: / } }]
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - { name: Strict-Transport-Security, value: "max-age=31536000; includeSubDomains" }
              - { name: Cross-Origin-Resource-Policy, value: same-origin }
              - { name: X-Content-Type-Options, value: nosniff }
        - type: ExtensionRef
          extensionRef: { group: gateway.envoyproxy.io, kind: HTTPRouteFilter, name: api-introuvable }
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: orders-jwt
spec:
  targetRefs: [{ group: gateway.networking.k8s.io, kind: HTTPRoute, name: orders }]
  jwt:
    providers:
      - name: keycloak
        issuer: KEYCLOAK_ISSUER
        audiences: ["pme-api"]
        remoteJWKS:
          uri: http://keycloak:8080/realms/pme/protocol/openid-connect/certs
          backendRefs: [{ group: "", kind: Service, name: keycloak, port: 8080 }]
          cacheDuration: 300s
  authorization:
    defaultAction: Deny
    rules:
      - name: role-customer
        action: Allow
        principal:
          jwt:
            provider: keycloak
            claims: [{ name: realm_access.roles, valueType: StringArray, values: ["CUSTOMER"] }]
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: stock-jwt
spec:
  targetRefs: [{ group: gateway.networking.k8s.io, kind: HTTPRoute, name: stock }]
  jwt:
    providers:
      - name: keycloak
        issuer: KEYCLOAK_ISSUER
        audiences: ["pme-api"]
        remoteJWKS:
          uri: http://keycloak:8080/realms/pme/protocol/openid-connect/certs
          backendRefs: [{ group: "", kind: Service, name: keycloak, port: 8080 }]
