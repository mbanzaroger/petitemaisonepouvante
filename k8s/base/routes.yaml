---
# Limitation de débit par adresse IP cliente sur la prise de commande (STRIDE : déni de service).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: orders-rate-limit
spec:
  targetRefs: [{ group: gateway.networking.k8s.io, kind: HTTPRoute, name: orders }]
  rateLimit:
    type: Local
    local:
      rules:
        - clientSelectors:
            - sourceCIDR: { value: 0.0.0.0/0, type: Distinct }
          limit: { requests: 50, unit: Second }
---
# Espace communautaire : limitation par adresse IP (spam de messages, d'annonces ou de signalements), en plus de
# l'anti-flood applicatif par membre (5 messages / 10 s).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: community-rate-limit
spec:
  targetRefs:
    - { group: gateway.networking.k8s.io, kind: HTTPRoute, name: community }
    - { group: gateway.networking.k8s.io, kind: HTTPRoute, name: catalog-interests }
  rateLimit:
    type: Local
    local:
      rules:
        - clientSelectors:
            - sourceCIDR: { value: 0.0.0.0/0, type: Distinct }
          limit: { requests: 20, unit: Second }
