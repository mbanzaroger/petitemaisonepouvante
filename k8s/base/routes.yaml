  authorization:
    defaultAction: Deny
    rules:
      - name: role-admin
        action: Allow
        principal:
          jwt:
            provider: keycloak
            claims: [{ name: realm_access.roles, valueType: StringArray, values: ["ADMIN"] }]
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: community-jwt
spec:
  targetRefs:
    - { group: gateway.networking.k8s.io, kind: HTTPRoute, name: community }
    - { group: gateway.networking.k8s.io, kind: HTTPRoute, name: catalog-interests }
  jwt:
    providers:
      - name: keycloak
        issuer: KEYCLOAK_ISSUER
        audiences: ["pme-api"]
        remoteJWKS:
          uri: http://keycloak:8080/realms/pme/protocol/openid-connect/certs
          backendRefs: [{ group: "", kind: Service, name: keycloak, port: 8080 }]
          cacheDuration: 300s
  authorization:
    defaultAction: Deny
    rules:
      - name: role-membre
        action: Allow
        principal:
          jwt:
            provider: keycloak
            claims: [{ name: realm_access.roles, valueType: StringArray, values: ["CUSTOMER", "ADMIN"] }]
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: community-moderation-jwt
spec:
  targetRefs: [{ group: gateway.networking.k8s.io, kind: HTTPRoute, name: community-moderation }]
