# Exposition par Gateway API (ADR-003). Le Gateway « pme-gateway » (plateforme) termine le TLS ;
# chaque route porte sa politique : catalogue public, commandes réservées à CUSTOMER, stock réservé à ADMIN.
# Les services valident aussi le jeton eux-mêmes (défense en profondeur).
# En-têtes de réponse ajoutés au Gateway (DAST ZAP, J4) : HSTS, puisque le TLS se termine ici et que les services
# ne voient que du HTTP, et Cross-Origin-Resource-Policy « same-origin » (une API n'a pas à être chargée par une
# autre origine sans CORS). La route « api-introuvable » applique les mêmes en-têtes aux chemins inconnus.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: catalog
spec:
  parentRefs: [{ name: pme-gateway }]
  hostnames: ["api.pme.local"]
  rules:
    - matches:
        - { path: { type: PathPrefix, value: /api/v1/products }, method: GET }
        - { path: { type: PathPrefix, value: /api/v1/categories }, method: GET }
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - { name: Strict-Transport-Security, value: "max-age=31536000; includeSubDomains" }
              - { name: Cross-Origin-Resource-Policy, value: same-origin }
      backendRefs: [{ name: catalog-service, port: 8081 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: orders
spec:
  parentRefs: [{ name: pme-gateway }]
  hostnames: ["api.pme.local"]
  rules:
    - matches: [{ path: { type: PathPrefix, value: /api/v1/orders } }]
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - { name: Strict-Transport-Security, value: "max-age=31536000; includeSubDomains" }
              - { name: Cross-Origin-Resource-Policy, value: same-origin }
      backendRefs: [{ name: order-service, port: 8082 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: stock
spec:
  parentRefs: [{ name: pme-gateway }]
  hostnames: ["api.pme.local"]
  rules:
    - matches: [{ path: { type: PathPrefix, value: /api/v1/stock } }]
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - { name: Strict-Transport-Security, value: "max-age=31536000; includeSubDomains" }
              - { name: Cross-Origin-Resource-Policy, value: same-origin }
      backendRefs: [{ name: stock-service, port: 8083 }]
---
# Chemins inconnus : réponse 404 problem+json produite par le Gateway, avec les en-têtes de sécurité
# (sans cette route, Envoy répond lui-même sans HSTS). Les routes plus précises restent prioritaires.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: api-introuvable
spec:
  directResponse:
    contentType: application/problem+json
    statusCode: 404
    body:
      type: Inline
      inline: '{"type":"about:blank","title":"Not Found","status":404}'
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-introuvable
spec:
  parentRefs: [{ name: pme-gateway }]
  hostnames: ["api.pme.local"]
  rules:
    - matches: [{ path: { type: PathPrefix, value: / } }]
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - { name: Strict-Transport-Security, value: "max-age=31536000; includeSubDomains" }
              - { name: Cross-Origin-Resource-Policy, value: same-origin }
              - { name: X-Content-Type-Options, value: nosniff }
        - type: ExtensionRef
          extensionRef: { group: gateway.envoyproxy.io, kind: HTTPRouteFilter, name: api-introuvable }
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: orders-jwt
spec:
  targetRefs: [{ group: gateway.networking.k8s.io, kind: HTTPRoute, name: orders }]
  jwt:
    providers:
      - name: keycloak
        issuer: KEYCLOAK_ISSUER
        audiences: ["pme-api"]
        remoteJWKS:
          uri: http://keycloak:8080/realms/pme/protocol/openid-connect/certs
          backendRefs: [{ group: "", kind: Service, name: keycloak, port: 8080 }]
          cacheDuration: 300s
  authorization:
    defaultAction: Deny
    rules:
      - name: role-customer
        action: Allow
        principal:
          jwt:
            provider: keycloak
            claims: [{ name: realm_access.roles, valueType: StringArray, values: ["CUSTOMER"] }]
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: stock-jwt
spec:
  targetRefs: [{ group: gateway.networking.k8s.io, kind: HTTPRoute, name: stock }]
  jwt:
    providers:
      - name: keycloak
        issuer: KEYCLOAK_ISSUER
        audiences: ["pme-api"]
        remoteJWKS:
          uri: http://keycloak:8080/realms/pme/protocol/openid-connect/certs
          backendRefs: [{ group: "", kind: Service, name: keycloak, port: 8080 }]
          cacheDuration: 300s
  authorization:
    defaultAction: Deny
    rules:
      - name: role-admin
        action: Allow
        principal:
          jwt:
            provider: keycloak
            claims: [{ name: realm_access.roles, valueType: StringArray, values: ["ADMIN"] }]
---
# Limitation de débit par adresse IP cliente sur la prise de commande (STRIDE : déni de service).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: orders-rate-limit
spec:
  targetRefs: [{ group: gateway.networking.k8s.io, kind: HTTPRoute, name: orders }]
  rateLimit:
    type: Local
    local:
      rules:
        - clientSelectors:
            - sourceCIDR: { value: 0.0.0.0/0, type: Distinct }
          limit: { requests: 50, unit: Second }
