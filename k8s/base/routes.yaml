# Exposition par Gateway API (ADR-003). Le Gateway « pme-gateway » (plateforme) termine le TLS ;
# chaque route porte sa politique : catalogue public, commandes réservées à CUSTOMER, stock réservé à ADMIN,
# espace communautaire : annonces en lecture publique, le reste réservé aux membres (CUSTOMER ou ADMIN),
# modération réservée à ADMIN.
# Le site (app.pme.local) et l'API partagent la même origine pour le navigateur : les routes catalogue,
# commandes et stock (espace administrateur) répondent aussi sur app.pme.local (ni CORS ni cookie ;
# ADR-002 révisé). api.pme.local reste l'entrée des intégrations et des tests.
# Les services valident aussi le jeton eux-mêmes (défense en profondeur).
# En-têtes de réponse ajoutés au Gateway (DAST ZAP, J4) : HSTS, puisque le TLS se termine ici et que les services
# ne voient que du HTTP, et Cross-Origin-Resource-Policy « same-origin » (une API n'a pas à être chargée par une
# autre origine sans CORS). La route « api-introuvable » applique les mêmes en-têtes aux chemins inconnus.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: catalog
spec:
  parentRefs: [{ name: pme-gateway }]
  hostnames: ["api.pme.local", "app.pme.local"]
  rules:
    - matches:
        - { path: { type: PathPrefix, value: /api/v1/products }, method: GET }
        - { path: { type: PathPrefix, value: /api/v1/categories }, method: GET }
        - { path: { type: PathPrefix, value: /api/v1/recommendations }, method: GET }
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - { name: Strict-Transport-Security, value: "max-age=31536000; includeSubDomains" }
              - { name: Cross-Origin-Resource-Policy, value: same-origin }
      backendRefs: [{ name: catalog-service, port: 8081 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: orders
spec:
  parentRefs: [{ name: pme-gateway }]
  hostnames: ["api.pme.local", "app.pme.local"]
  rules:
    - matches: [{ path: { type: PathPrefix, value: /api/v1/orders } }]
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - { name: Strict-Transport-Security, value: "max-age=31536000; includeSubDomains" }
              - { name: Cross-Origin-Resource-Policy, value: same-origin }
      backendRefs: [{ name: order-service, port: 8082 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: stock
spec:
  parentRefs: [{ name: pme-gateway }]
