apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pme
resources:
  - ../../base
  - databases.yaml
  - rabbitmq.yaml
  - hpa.yaml
configMapGenerator:
  - name: pme-config
    literals:
      - jwt-jwk-set-uri=http://keycloak:8080/realms/pme/protocol/openid-connect/certs
      - jwt-issuer-uri=https://keycloak.pme.local:8443/realms/pme
      - keycloak-public-url=https://keycloak.pme.local:8443
patches:
  - target: { kind: SecurityPolicy }
    patch: |-
      - op: replace
        path: /spec/jwt/providers/0/issuer
        value: https://keycloak.pme.local:8443/realms/pme
  # Le nombre d'instances est piloté par les HPA (hpa.yaml) : un « kubectl apply » ne doit pas le réinitialiser.
  - target: { kind: Deployment, labelSelector: "app in (catalog-service,order-service,stock-service)" }
    patch: |-
      - op: remove
        path: /spec/replicas
