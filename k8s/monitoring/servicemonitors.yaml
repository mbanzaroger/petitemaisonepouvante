# Collecte des métriques Actuator des trois services et de la profondeur des files RabbitMQ (US5).
# Le libellé « service » ajouté par l'opérateur Prometheus vaut le nom du Service Kubernetes :
# les requêtes du tableau de bord et des alertes sont donc identiques en local et en staging.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pme-services
  namespace: pme
spec:
  selector:
    matchExpressions:
      - { key: app, operator: In, values: [catalog-service, order-service, stock-service] }
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
---
# Point de terminaison détaillé du plugin rabbitmq_prometheus : une série par file, dont les files de rebut.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pme-rabbit
  namespace: pme
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: pme-rabbit, app.kubernetes.io/component: rabbitmq }
  endpoints:
    - port: prometheus
      path: /metrics/detailed
      params:
        family: [queue_coarse_metrics, queue_consumer_count]
      interval: 15s
